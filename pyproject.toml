[project]
name = "llm-security-suite"
version = "0.1.0"
description = "Prompt-injection and jailbreak test suite — requires llm-attack-corpus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests",
    "pyyaml",
    "pytest",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]